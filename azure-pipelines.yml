# Variable 'GRADLE_PUBLISH_KEY' was defined in the Variables tab
# Variable 'GRADLE_PUBLISH_SECRET' was defined in the Variables tab
variables:
- name: BuildParameters.jdkVersion
  value: 1.8
trigger:
  branches:
    include:
    - main
  tags:
    - v*
name: $(date:yyyyMMdd)$(rev:.r)
resources:
  repositories:
  - repository: self
    type: git
    ref: main
jobs:
- job: Job_1
  displayName: check
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
  - task: Gradle@3
    displayName: gradlew validate
    inputs:
      tasks: check validatePlugins
      jdkVersion: $(BuildParameters.jdkVersion)
- job: Job_2
  displayName: publish
  dependsOn: Job_1
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
  - task: Gradle@3
    displayName: gradlew publishPlugins
    condition: and(succeeded(), startsWith(variables['build.sourceBranch'], 'refs/tags/v'))
    inputs:
      options: -Pgradle.publish.key=${GRADLE_PUBLISH_KEY) -Pgradle.publish.secret=$(GRADLE_PUBLISH_SECRET)
      tasks: publishPlugins
      publishJUnitResults: false
      jdkVersion: $(BuildParameters.jdkVersion)
...
