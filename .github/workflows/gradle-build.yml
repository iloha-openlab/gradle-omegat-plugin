name: Run Gradle test

on:
  pull_request:
  push:
    branches:
      - main
      - releases/*

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'
      - uses: gradle/gradle-build-action@v3
        with:
          arguments: build validatePlugins
